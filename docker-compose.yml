# Thử nghiệm 1 máy: 3 trạm Postgres 18 (cổng 5432/5433/5434).
# Khi tách 2 máy: máy A chạy campus_a, máy B chạy campus_b + campus_c (dùng profile).
name: de02
x-pg: &pg
  image: postgres:18
  environment:
    POSTGRES_PASSWORD: cs5104
    POSTGRES_USER: postgres
  command: ["postgres", "-c", "listen_addresses=*", "-c", "max_connections=100"]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 3s
    timeout: 3s
    retries: 20

services:
  campus_a:
    <<: *pg
    profiles: ["A", "all"]
    ports: ["5432:5432"]
    volumes:
      - a_data:/var/lib/postgresql
      - ./data:/data:ro
      - ./sql:/sql:ro
  campus_b:
    <<: *pg
    profiles: ["B", "all"]
    ports: ["5433:5432"]
    volumes:
      - b_data:/var/lib/postgresql
  campus_c:
    <<: *pg
    profiles: ["B", "all"]
    ports: ["5434:5432"]
    volumes:
      - c_data:/var/lib/postgresql

  # Proxy độ trễ đứng giữa trạm trung tâm và các trạm xa (postgres_fdw đi qua đây).
  # scripts/delay.sh on|off thêm/bỏ độ trễ; chạy cùng máy với campus_a.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    profiles: ["A", "all"]
    ports: ["8474:8474"]

volumes:
  a_data:
  b_data:
  c_data:
